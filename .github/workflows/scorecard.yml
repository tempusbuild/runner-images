name: scorecard

# OpenSSF Scorecard — continuous assessment of supply-chain posture.
# Public repo → publish_results gives a public badge and an OpenSSF API record (transparency).
on:
  # branch_protection_rule — Scorecard's special trigger: without it the Branch-Protection check is not assessed.
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"   # weekly, Mon 04:27 UTC (odd minute — off the cron peak)
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code-scanning
      id-token: write          # publish_results (OIDC to the OpenSSF API)
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        id: scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif

  notify-failure:
    needs: analysis
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write   # failure issue (in notify-failure.yml)
    # ./ reusable-workflow calls resolve server-side at the caller's commit (not from the workspace);
    # $/ is rejected by actionlint (v1.7.12), a required gate.
    uses: ./.github/workflows/notify-failure.yml  # zizmor: ignore[self-repository]
