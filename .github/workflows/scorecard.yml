name: scorecard

# OpenSSF Scorecard — continuous assessment of supply-chain posture.
# Public repo → publish_results gives a public badge and an OpenSSF API record (transparency).
on:
  # branch_protection_rule — Scorecard's special trigger: without it the Branch-Protection check is not assessed.
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"   # weekly, Mon 04:27 UTC (odd minute — off the cron peak)
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code-scanning
      id-token: write          # publish_results (OIDC to the OpenSSF API)
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        id: scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1  # v4.37.2
        with:
          sarif_file: results.sarif

  notify-failure:
    needs: analysis
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write   # failure issue (in notify-failure.yml)
    uses: ./.github/workflows/notify-failure.yml
