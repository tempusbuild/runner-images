name: codeql

# SAST for GitHub Actions workflows (CodeQL `actions` language).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload CodeQL results to code-scanning
      actions: read            # read workflow metadata for the `actions` language
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:actions"

  notify-failure:
    needs: analyze
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write   # failure issue (in notify-failure.yml)
    # ./ reusable-workflow calls resolve server-side at the caller's commit (not from the workspace);
    # $/ is rejected by actionlint (v1.7.12), a required gate.
    uses: ./.github/workflows/notify-failure.yml  # zizmor: ignore[self-repository]
