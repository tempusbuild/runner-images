name: codeql

# SAST for GitHub Actions workflows (CodeQL `actions` language).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload CodeQL results to code-scanning
      actions: read            # read workflow metadata for the `actions` language
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1  # v4.37.2
        with:
          languages: actions
      - uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1  # v4.37.2
        with:
          category: "/language:actions"

  notify-failure:
    needs: analyze
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write   # failure issue (in notify-failure.yml)
    uses: ./.github/workflows/notify-failure.yml
