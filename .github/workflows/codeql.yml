name: codeql

# SAST for GitHub Actions workflows (CodeQL `actions` language).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload CodeQL results to code-scanning
      actions: read            # read workflow metadata for the `actions` language
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          languages: actions
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          category: "/language:actions"

  notify-failure:
    needs: analyze
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write   # failure issue (in notify-failure.yml)
    uses: ./.github/workflows/notify-failure.yml
