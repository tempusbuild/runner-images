name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Serialize builds: the fixed group covers both a main push and the weekly workflow_call
# (github.workflow differs between them); no cancel — a signing run must finish.
concurrency:
  group: image-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-push:
    name: Build, scan, sign, push
    # Larger runner: the SBOM step OOMs the standard 16 GB runner on the full image.
    runs-on: ubuntu-2404-8core
    permissions:
      contents: read
      packages: write       # push image to ghcr
      id-token: write       # cosign keyless (Fulcio OIDC) + Sigstore attestations
      attestations: write   # GitHub artifact attestations (SBOM + provenance)
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit   # build an egress baseline first; switch to block once stable
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      # The full-parity image is large; reclaim the runner's preinstalled toolchains so the
      # docker build does not run the host out of disk.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
            /usr/lib/jvm /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Ephemeral per-run token, not a long-lived PAT.
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/tempusbuild/runner-ubuntu-24.04
          # No :latest (floating tags disallowed). Consumers pin date@sha256.
          tags: |
            type=raw,value=v{{date 'YYYYMMDD'}}
            type=sha
      # 1) Push by digest ONLY — no consumable tags until the gates pass. Deliberately uncached:
      #    the weekly rebuild must pull fresh apt patches, and the signed artifact must not be
      #    assembled from a poisonable cache.
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ubuntu-24.04
          outputs: type=image,name=ghcr.io/tempusbuild/runner-ubuntu-24.04,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true              # SBOM attestation (SPDX)
          provenance: mode=max    # SLSA provenance attestation (targets Build L3)

      # The ~4 GiB builder cache is dead weight past the push.
      - name: Reclaim build cache
        run: |
          set -euo pipefail
          docker buildx prune -af >/dev/null
          df -h / | tail -1

      # 2) CVE gate on the exact published digest. Runs before the smoke tests, streaming from the
      #    registry (image-src=remote) — no ~4 GiB docker-export to /tmp. Registry auth comes from
      #    the docker/login-action step above; removing that step breaks the untagged-digest pull.
      - name: Trivy scan (gate by digest)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          # No "new version available" notices / phone-home from the gate; trivy version comes from the action pin.
          TRIVY_SKIP_VERSION_CHECK: "true"
          TRIVY_IMAGE_SRC: "remote"
        with:
          image-ref: ghcr.io/tempusbuild/runner-ubuntu-24.04@${{ steps.build.outputs.digest }}
          # OS-scoped gate; bundled-tool library CVEs tracked via pinned versions — see SECURITY.md.
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      # 3) Smoke-test the same digest — the PR build is a different build of the same inputs.
      - name: Smoke tests (by digest)
        env:
          IMAGE: ghcr.io/tempusbuild/runner-ubuntu-24.04
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/tests:/tests:ro" "${IMAGE}@${DIGEST}" \
            bash -c 'for t in /tests/*.sh; do echo "== $t =="; bash "$t" || exit 1; done'

      # 4) Only after green gates — apply public tags to the same digest (no rebuild), so
      #    consumable tags NEVER point at an image that did not pass.
      - name: Tag scanned digest
        env:
          IMAGE: ghcr.io/tempusbuild/runner-ubuntu-24.04
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create --tag "$tag" "${IMAGE}@${DIGEST}"
          done <<< "$TAGS"

      # 5) Sign by digest + immediate verify (proves the Rekor entry).
      - name: Sign and verify (cosign keyless / OIDC)
        env:
          IMAGE: ghcr.io/tempusbuild/runner-ubuntu-24.04
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/tempusbuild/runner-images/\.github/workflows/build\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${DIGEST}"

      # 6) SBOM via cosign attest, not GitHub attest: the full-image SPDX exceeds attest's 16 MiB cap.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        env:
          # Cap syft's heap so it GCs instead of OOM-killing.
          GOMEMLIMIT: 26GiB
        with:
          image: ghcr.io/tempusbuild/runner-ubuntu-24.04@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest SBOM (cosign keyless / OIDC)
        env:
          IMAGE: ghcr.io/tempusbuild/runner-ubuntu-24.04
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp '^https://github\.com/tempusbuild/runner-images/\.github/workflows/build\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${DIGEST}" > /dev/null
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ghcr.io/tempusbuild/runner-ubuntu-24.04
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false   # storage records are broken for registry images (actions/attest#401)
