name: test

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skip the build/scan steps on PRs that touch no image-affecting file (docs/config-only). The jobs
  # still run and report green (steps skip, not jobs), so required checks stay satisfied.
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE" "$HEAD_SHA" | grep -qE \
            '^(ubuntu-24\.04/(Dockerfile|packages\.txt)|ubuntu-24\.04-minimal/Dockerfile|tests/|\.trivyignore\.yaml|\.github/workflows/test\.yml)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      # Hook environments are expensive to build (node/golang toolchains) — cache them.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Plain steps instead of the maintenance-mode pre-commit/action (it pulls a deprecated
      # node20 actions/cache internally). Hash-pinned lockfile, regenerated by Renovate (pip-compile).
      - run: pip install --require-hashes -r .github/lint-requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure

  build-test:
    name: Build and test (full)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # The full-parity image is large; reclaim the runner's preinstalled toolchains so the
      # docker build does not run the host out of disk.
      - name: Free disk space
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
            /usr/lib/jvm /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        if: needs.changes.outputs.image == 'true'
      # No GHA layer cache here: the full image (~36 GiB) exceeds the 10 GB per-repo cache limit,
      # and staging mode=max compressed diffs exhausts the build disk. Like the release build
      # (build.yml), this builds uncached.
      - name: Build image
        if: needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ubuntu-24.04
          load: true
          tags: tempusbuild/runner-ubuntu-24.04:pr
      - name: Image size gate
        if: needs.changes.outputs.image == 'true'
        env:
          MAX_BYTES: "42000000000"   # budget; CI-measured ~36 GiB (full ubuntu-latest parity)
        run: |
          set -euo pipefail
          size=$(docker image inspect tempusbuild/runner-ubuntu-24.04:pr --format '{{.Size}}')
          printf 'full image size: %s (budget %s)\n' "$(numfmt --to=iec "$size")" "$(numfmt --to=iec "$MAX_BYTES")" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -le "$MAX_BYTES" ] || { echo "image size $size exceeds budget $MAX_BYTES" >&2; exit 1; }
      # Buildkit retains the build layers after load; drop them so the daemon-read scanners have scratch.
      - name: Reclaim build cache
        if: needs.changes.outputs.image == 'true'
        run: docker buildx prune --all --force
      # DKL-DI-0001 (sudo) is ignored: passwordless sudo is the runner-image contract.
      # CIS-DI-0010 stays on; the -ae/-af below accept names it false-flags inside bundled
      # third-party payloads (test fixtures + library source), not real credentials.
      - name: Dockle (CIS image lint)
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 \
            --exit-code 1 --timeout 1200s -i DKL-DI-0001 \
            -ae pcap -af id_ecdsa -af database.yml -af settings.py \
            tempusbuild/runner-ubuntu-24.04:pr
      - name: Dive (layer efficiency)
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -e CI=true \
            wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10 \
            --ci tempusbuild/runner-ubuntu-24.04:pr
      - name: Smoke tests
        if: needs.changes.outputs.image == 'true'
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" tempusbuild/runner-ubuntu-24.04:pr \
            bash -c 'rc=0; for t in /tests/*.sh; do echo "== $t =="; bash "$t" || rc=1; done; exit $rc'
      # OS-scoped gate (scanners=vuln, vuln-type=os): secrets via gitleaks + Dockle; bundled-tool
      # library CVEs tracked via pinned versions, not gated — full rationale in SECURITY.md.
      - name: Trivy scan
        if: needs.changes.outputs.image == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: tempusbuild/runner-ubuntu-24.04:pr
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          timeout: 30m

  build-test-minimal:
    name: Build and test (minimal)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        if: needs.changes.outputs.image == 'true'
      - name: Build minimal image
        if: needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ubuntu-24.04-minimal
          load: true
          tags: tempusbuild/runner-ubuntu-24.04-minimal:pr
          cache-from: type=gha,scope=minimal
          cache-to: type=gha,scope=minimal,mode=max
      - name: Image size gate
        if: needs.changes.outputs.image == 'true'
        env:
          MAX_BYTES: "1000000000"   # budget; CI-measured size ~815 MiB
        run: |
          set -euo pipefail
          size=$(docker image inspect tempusbuild/runner-ubuntu-24.04-minimal:pr --format '{{.Size}}')
          printf 'minimal image size: %s (budget %s)\n' "$(numfmt --to=iec "$size")" "$(numfmt --to=iec "$MAX_BYTES")" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -le "$MAX_BYTES" ] || { echo "image size $size exceeds budget $MAX_BYTES" >&2; exit 1; }
      - name: Dockle (CIS image lint)
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 \
            --exit-code 1 -i DKL-DI-0001 tempusbuild/runner-ubuntu-24.04-minimal:pr
      - name: Dive (layer efficiency)
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -e CI=true \
            wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10 \
            --ci tempusbuild/runner-ubuntu-24.04-minimal:pr
      - name: Smoke tests
        if: needs.changes.outputs.image == 'true'
        # minimal has no node/docker/python/unzip — the shared /tests/*.sh does not fit it. Run only
        # runner-agent + the base tool set (what minimal actually contains).
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" tempusbuild/runner-ubuntu-24.04-minimal:pr \
            bash -c 'rc=0; for t in /tests/test_runner.sh /tests/test_minimal_base.sh; do echo "== $t =="; bash "$t" || rc=1; done; exit $rc'
      - name: Trivy scan
        if: needs.changes.outputs.image == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: tempusbuild/runner-ubuntu-24.04-minimal:pr
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
          exit-code: "1"
