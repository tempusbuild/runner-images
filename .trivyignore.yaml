# Documented trivy exceptions — policy and required fields are described in SECURITY.md.
vulnerabilities:
  # Firefox is installed from the Mozilla apt repo (current stable, bundling patched expat). Trivy
  # maps these 2022 expat CVEs to Ubuntu's snap-transitional firefox, which this image does not use.
  - id: CVE-2022-25235
    statement: "FP: Firefox from the Mozilla apt repo bundles patched expat; Trivy's fix maps to the unused Ubuntu snap firefox."
    expired_at: 2026-09-15
  - id: CVE-2022-25236
    statement: "FP: Firefox from the Mozilla apt repo bundles patched expat; Trivy's fix maps to the unused Ubuntu snap firefox."
    expired_at: 2026-09-15
